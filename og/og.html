<!doctype html>
<!-- Source for /og.png, the 1200x630 social card. Re-render with:
       node og/render.mjs
     Mirrors the homepage hero: same fonts, tokens, dot grid and sigil. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>arfat.me social card</title>
<style>
@font-face { font-family:'Space Mono'; font-weight:400; src:url(../media/fonts/spacemono-400.woff2) format('woff2'); }
@font-face { font-family:'Spectral'; font-weight:400; src:url(../media/fonts/spectral-400.woff2) format('woff2'); }
@font-face { font-family:'Spectral'; font-style:italic; font-weight:400; src:url(../media/fonts/spectral-400i.woff2) format('woff2'); }

:root {
  --bg: #ffffff;
  --text: #0c0c0c;
  --muted: #5f5f5f;
  --accent: #1a3770;
}
html, body { margin: 0; }
body {
  width: 1200px;
  height: 630px;
  box-sizing: border-box;
  padding: 64px 80px 60px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: var(--bg);
  background-image: radial-gradient(circle, #1a377014 1.5px, transparent 1.5px);
  background-size: 32px 32px;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
.top { display: flex; justify-content: space-between; align-items: flex-start; }
.wordmark { font-family: 'Space Mono', monospace; font-size: 24px; color: var(--accent); letter-spacing: .04em; }
.sigil { width: 112px; height: 112px; margin: -12px -8px 0 0; }
.si-st { stroke: var(--text); fill: none; }
.si-ft { fill: var(--text); stroke: none; }
.si-sa { stroke: var(--accent); fill: none; }
h1 {
  margin: 0 0 0 -27px;
  padding-left: 24px;
  border-left: 3px solid var(--accent);
  font-family: 'Spectral', Georgia, serif;
  font-weight: 400;
  font-size: 56px;
  line-height: 1.22;
  letter-spacing: -0.012em;
  max-width: 960px;
  text-wrap: balance;
}
h1 em { font-style: italic; }
.meta {
  display: flex;
  justify-content: space-between;
  font-family: 'Space Mono', monospace;
  font-size: 20px;
  color: var(--muted);
}
</style>
</head>
<body>
  <div class="top">
    <span class="wordmark">arfat.me</span>
    <svg class="sigil" viewBox="0 0 80 80" aria-hidden="true">
      <circle class="si-st" cx="40" cy="44" r="22" stroke-width="1.4"/>
      <circle class="si-ft" cx="32" cy="40" r="2.5"/>
      <circle class="si-st" cx="46" cy="48" r="3.5" stroke-width="1"/>
      <circle class="si-ft" cx="48" cy="36" r="1.5"/>
      <g transform="translate(56,12) rotate(15)">
        <circle class="si-sa" r="3.5" stroke-width="1.4"/>
        <line class="si-sa" x1="0" y1="3.5" x2="0" y2="11" stroke-width="1.4" stroke-linecap="round"/>
        <line class="si-sa" x1="-4" y1="7" x2="4" y2="7" stroke-width="1.4" stroke-linecap="round"/>
        <line class="si-sa" x1="0" y1="11" x2="-3" y2="15" stroke-width="1.4" stroke-linecap="round"/>
        <line class="si-sa" x1="0" y1="11" x2="3" y2="15" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <path class="si-sa" d="M58 16 C 50 22, 48 30, 44 34" stroke-width="1" stroke-dasharray="1.5 2"/>
    </svg>
  </div>

  <h1>i build the parts of software nobody sees. <em>auth, infra, the security layer</em> that gets bolted on last.</h1>

  <div class="meta">
    <span>muhammad arfat · backend &amp; secure systems</span>
    <span>islamabad</span>
  </div>
</body>
</html>
